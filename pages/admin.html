<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <script>
        if (sessionStorage.getItem("adminAuth") !== "1") {
            window.location.replace("login.html");
        }
    </script>
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin-bottom: 1rem;">
        <h1 style="margin: 0;">Records</h1>
        <a href="#" id="logout-btn">Log out</a>
    </div>
    <script>
        document.getElementById("logout-btn").addEventListener("click", function (e) {
            e.preventDefault();
            sessionStorage.removeItem("adminAuth");
            window.location.replace("login.html");
        });
    </script>
    
        
        <div class="input-control">
            <select id="searchinput" required>
                <option value="" disabled selected>Search by:</option>
                <option value="course">Course</option>
                <option value="yrgrad">Year Graduated</option>
            </select>

    <br>


<div class="datatable">

    <table id="searchbar">
        <thead>
            <tr>
                <th> Name </th>
                <th> Address </th>
                <th> Birthday </th>
                <th> Email </th>
                <th> Viber </th>
                <th> Course </th>
                <th> Year Graduated </th>
            </tr>
            <tbody id="records-tbody">
                
            </tbody>
        </thead>
    </table>
    </div>
    </div>
        
    <script src="../adminscript.js"></script>
</body>

</html>
