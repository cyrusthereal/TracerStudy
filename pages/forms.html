<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./forms.css">
</head>

<body>
    <div class="container">
        <h1>Forms</h1>

        <label for="fname"> First Name</label>
        <div class="input-control" id="fnameContainer">
            <div class="input" >
                <input id="fname" name="fname" type="text">
            </div>
            <div class="error"></div>
        </div>

        <label for="lname"> Last Name</label>
        <div class="input-control" id="lnameContainer">
            <div class="input" >
                <input id="lname" name="lname" type="text" required>
            </div>
            <div class="error"></div>
        </div>

        <label for="studentNumber"> Student Number (optional)</label>
        <div class="input-control" id="studentNumberContainer">
            <div class="input">
                <input id="studentNumber" name="studentNumber" type="text">
            </div>
            <div class="error"></div>
        </div>

        <label>Address (Philippines)</label>
        <div class="input-control" id="addressContainer">
            <div class="input address-cascade">
                <select id="addr-region" aria-label="Region">
                    <option value="">Select region</option>
                </select>
                <select id="addr-province" aria-label="Province" disabled>
                    <option value="">Select province</option>
                </select>
                <select id="addr-city" aria-label="City or municipality" disabled>
                    <option value="">Select city / municipality</option>
                </select>
                <select id="addr-barangay" aria-label="Barangay" disabled>
                    <option value="">Select barangay</option>
                </select>
                <input type="text" id="addr-street" name="addr-street" placeholder="Street, house no., building (optional)">
            </div>
            <div class="error" id="addr-error"></div>
        </div>

        <label for="Birthday"> Birthday </label>
        <div class="input-control" id="birthdayContainer">
            <div class="input">
                <input type="date" id="calendarPicker">
            </div>
            <div class="error"></div>
        </div>

        <label for="email"> Email</label>
        <div class="input-control" id="emailContainer">
            <div class="input">
                <input id="email" name="email" type="email" required>
            </div>
            <div class="error"></div>
        </div>

        <label for="cpnum"> Viber</label>
        <div class="input-control" id="viberContainer">
            <div class="input">
                <input id="cpnum" name="cpnum" type="text" minlength="11" maxlength="11" pattern="\d{11}" title="Viber number must be exactly 11 digits">
            </div>
            <div class="error"></div>
        </div>

        <label for="Course">Course:</label>
        <div class="input-control">
            <select id="category" class="category">
                <optgroup label="College of Education">
                    <option value="BEED">BACHELOR OF ELEMENTARY EDUCATION</option>
                    <option value="BSED">BACHELOR OF SECONDARY EDUCATION Major in Values Education, Science, Mathematics and
                        English</option>
                    <option value="BSNED">BACHELOR OF SPECIAL NEEDS EDUCATION</option>
                </optgroup>

                <optgroup label="College of Nursing">
                    <option value="BSN">BACHELOR OF SCIENCE IN NURSING</option>
                </optgroup>

                <optgroup label="College of Business &amp; Accountancy">
                    <option value="BSA">BACHELOR OF SCIENCE IN ACCOUNTANCY</option>
                    <option value="BSAIS">BACHELOR OF SCIENCE IN ACCOUNTING INFORMATION SYSTEM</option>
                    <option value="BSBA_MM">BACHELOR OF SCIENCE IN BUSINESS ADMINISTRATION, Major in Marketing Management</option>
                    <option value="BSBA-FM">BACHELOR OF SCIENCE IN BUSINESS ADMINISTRATION, Major in Financial Management</option>
                    <option value="BSBA-M">BACHELOR OF SCIENCE IN BUSINESS ADMINISTRATION, Major in Management</option>
                </optgroup>

                <optgroup label="College of Hospitality, Tourism &amp; Culinary Management">
                    <option value="BSHM">BACHELOR OF SCIENCE IN HOSPITALITY MANAGEMENT</option>
                    <option value="BSTOM">BACHELOR OF SCIENCE IN TOURISM MANAGEMENT</option>
                    <option value="BSCM">BACHELOR OF SCIENCE IN CULINARY MANAGEMENT</option>
                </optgroup>

                <optgroup label="College of Engineering &amp; Information Technology">
                    <option value="BSIE">BACHELOR OF SCIENCE IN INDUSTRIAL ENGINEERING</option>
                    <option value="BSCPE">BACHELOR OF SCIENCE IN COMPUTER ENGINEERING</option>
                    <option value="BSCS">BACHELOR OF SCIENCE IN COMPUTER SCIENCE</option>
                    <option value="BSIT">BACHELOR OF SCIENCE IN INFORMATION TECHNOLOGY</option>
                    <option value="BSECE">BACHELOR OF SCIENCE IN ELECTRONICS ENGINEERING</option>
                </optgroup>

                <optgroup label="Special Programs">
                    <option value="ETEEAP">Expanded Tertiary Education, Equivalency and Accreditation Program (ETEEAP), BS Business Administration</option>
                    <option value="CEP">CONTINUING EDUCATION PROGRAM, BS Business Administration</option>
                    <option value="TCP">TEACHER CERTIFICATE PROGRAM</option>
                </optgroup>
            </select>
        </div>

        <label for="yearGraduated">Year Graduated:</label>
        <div class="input-control">
            <select id="yearGraduated" class="yearGraduated">
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>
        <button type="submit" id="submit-btn"> Submit </button>

        <!-- Email OTP modal (shown after form validates) -->
        <div id="otp-modal-overlay" class="otp-modal-overlay" aria-hidden="true" hidden></div>
        <div id="otp-modal" class="otp-modal" role="dialog" aria-labelledby="otp-modal-title" aria-modal="true" hidden>
            <h2 id="otp-modal-title">Verify your email</h2>
            <p id="otp-modal-text" class="otp-modal-text">We sent a 6-digit code to your email.</p>
            <div class="otp-input-wrap">
                <input type="text" id="otp-input" inputmode="numeric" maxlength="6" pattern="\d{6}" autocomplete="one-time-code" placeholder="000000" aria-label="Verification code">
            </div>
            <p id="otp-modal-status" class="otp-modal-status" role="status"></p>
            <div class="otp-modal-actions">
                <button type="button" id="otp-verify-btn">Verify</button>
                <button type="button" id="otp-resend-btn">Resend code</button>
                <button type="button" id="otp-cancel-btn" class="otp-btn-secondary">Cancel</button>
            </div>
        </div>

        <!-- OTP API base URL only (no /insert). script.js adds /request-otp, /verify-otp, /insert -->
        <script>
            // Local: http://localhost:3000 | Live: your Render Web Service URL (same app as backend/)
            window.TRACER_API_BASE = "https://backend-1-wsky.onrender.com";
            // Optional: if home page is not ../index.html from this file, set e.g. window.TRACER_INDEX_URL = "/index.html";
        </script>
        <script src="../address-psgc.js"></script>
        <script src="../script.js"></script>
</body>


</html>
