<body>
    <script>
        if (sessionStorage.getItem("adminAuth") !== "1") {
            window.location.replace("../index.html");
        }
    </script>
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin-bottom: 1rem;">
        <h1 style="margin: 0;">Records</h1>
        <a href="#" id="logout-btn">Log out</a>
    </div>
    <script>
        document.getElementById("logout-btn").addEventListener("click", function (e) {
            e.preventDefault();
            sessionStorage.removeItem("adminAuth");
            window.location.replace("login.html");
        });
    </script>
    
        
        <div class="input-control">
            <select id="searchinput" required>

                <option value="address">Address</option>
            </select>

    <br>
    <div id="search-controls" style="margin-top:0.5rem;">

        <select id="search-year" style="display:none; min-width:120px;"></select>
        <input id="search-address" type="text" style="display:none; min-width:240px;" placeholder="Enter address keyword" />
        <button id="filter-btn" type="button" style="display:none; margin-left:0.5rem;">Filter</button>
        <button id="clear-filter-btn" type="button" style="display:none; margin-left:0.25rem;">Clear</button>
    </div>
